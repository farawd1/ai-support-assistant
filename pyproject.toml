[project]
name = "repl-support"
version = "0.2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4",
  "vercel-queue==0.9.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.fastapi.static]
cdn = true

[[tool.vercel.subscribers]]
entrypoint = "queue_tasks"
